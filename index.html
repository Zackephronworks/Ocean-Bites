<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Bites | Zackephron Works</title>
    <style>
        :root {
            --ocean-blue: #0077b6;
            --sand-yellow: #f4d35e;
            --z-gold: #ffb703;
            --neon-blue: #00f5ff;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }

        /* --- LOADING SCREEN (From your Image) --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #023047, #001d3d);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            transition: opacity 1s ease;
        }
        .z-logo { font-size: 80px; font-weight: bold; color: white; text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 20px; }
        .loading-bar-container { width: 250px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 15px; border: 2px solid var(--z-gold); overflow: hidden; }
        .loading-fill { width: 65%; height: 100%; background: linear-gradient(90deg, #ffb703, #fb8500); transition: width 2s; }
        .loading-text { color: white; margin-top: 10px; letter-spacing: 2px; font-size: 14px; }

        /* --- GAME WORLD --- */
        #game-container { display: none; width: 100%; height: 100%; background: var(--ocean-blue); position: relative; }
        #sand-bank { position: absolute; bottom: 0; width: 100%; height: 30%; background: var(--sand-yellow); border-top: 10px solid #ee964b; }

        /* --- STACKING VISUALS --- */
        #player {
            position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            width: 50px; height: 80px; background: #023047; border-radius: 10px; border: 3px solid white;
        }
        #fish-stack { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; }
        .fish-item { 
            width: 40px; height: 15px; background: #fb8500; margin: 2px; border-radius: 5px; 
            border: 1px solid white; animation: wobble 2s infinite ease-in-out;
        }

        /* --- UI BOARD --- */
        #ui-top {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 50;
        }
        .hud-box { background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 15px; border-bottom: 4px solid var(--z-gold); font-weight: bold; }

        @keyframes wobble { 
            0%, 100% { transform: translateX(0); } 
            50% { transform: translateX(5px); } 
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="z-logo">Z</div>
        <div style="color:white; margin-bottom:10px;">ZACKEPHRON WORKS</div>
        <div class="loading-bar-container">
            <div class="loading-fill"></div>
        </div>
        <div class="loading-text">LOADING EMPIRE... 65%</div>
    </div>

    <div id="game-container">
        <div id="ui-top">
            <div class="hud-box">🪙 Gold: <span id="gold-val">0</span></div>
            <div class="hud-box">🐟 Stack: <span id="stack-val">0</span>/10</div>
        </div>

        <div id="player">
            <div id="fish-stack"></div>
        </div>
        
        <div id="sand-bank">
            <button onclick="sellFish()" style="position:absolute; top:-50px; left:50%; transform:translateX(-50%); padding:10px 30px; background:var(--z-gold); border:none; border-radius:20px; font-weight:bold; cursor:pointer;">SELL FISH 💰</button>
        </div>
    </div>
