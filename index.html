<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Bites | Zackephron Works</title>
    <style>
        :root { --ocean: #0077b6; --sand: #f4d35e; --z-gold: #ffb703; --neon: #00f5ff; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }

        /* --- 1. THE PRO LOADING SCREEN --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #023047, #001d3d);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .z-logo { font-size: 80px; font-weight: bold; color: white; text-shadow: 0 0 20px var(--neon); margin-bottom: 10px; }
        .loading-bar-container { width: 250px; height: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; border: 2px solid var(--z-gold); overflow: hidden; }
        .loading-fill { width: 0%; height: 100%; background: var(--z-gold); transition: width 3s ease-in-out; }
        .loading-text { color: white; margin-top: 15px; font-size: 14px; letter-spacing: 2px; }

        /* --- 2. THE GAME WORLD --- */
        #game-container { visibility: hidden; width: 100%; height: 100%; background: var(--ocean); position: relative; }
        #sand-bank { position: absolute; bottom: 0; width: 100%; height: 35%; background: var(--sand); border-top: 8px solid #ee964b; }

        /* --- 3. THE STACKING SYSTEM --- */
        #player {
            position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%);
            width: 45px; height: 75px; background: #023047; border: 3px solid white; border-radius: 8px;
        }
        #fish-stack { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; }
        .fish-box { width: 35px; height: 12px; background: #fb8500; margin: 1px; border-radius: 4px; border: 1px solid white; }

        /* --- 4. THE HUD --- */
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 50; }
        .hud-item { background: white; padding: 10px 20px; border-radius: 12px; border-bottom: 4px solid var(--z-gold); font-weight: bold; }
        button { padding: 12px 30px; background: #fb8500; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; border-bottom: 4px solid #b56100; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="z-logo">Z</div>
        <div style="color:white; font-weight:bold; margin-bottom:20px;">ZACKEPHRON WORKS</div>
        <div class="loading-bar-container"><div class="loading-fill" id="fill"></div></div>
        <div class="loading-text">LOADING EMPIRE... <span id="percent">0</span>%</div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div class="hud-item">🪙 Gold: <span id="gold">0</span></div>
            <div class="hud-item">🐟 Stack: <span id="stack">0</span>/10</div>
        </div>

        <div id="player"><div id="fish-stack"></div></div>
        <div id="sand-bank">
            <div style="text-align:center; margin-top: 40px;">
                <button onclick="sell()">💰 SELL STACK 💰</button>
            </div>
        </div>
    </div>

    <script>
        let gold = 0, stack = 0;

        // 🚀 STARTUP LOADING LOGIC
        window.onload = () => {
            const fill = document.getElementById('fill');
            const perc = document.getElementById('percent');
            fill.style.width = "100%";
            let count = 0;
            let interval = setInterval(() => {
                count += 2;
                perc.innerText = count;
                if(count >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        document.getElementById('game-container').style.visibility = 'visible';
                    }, 500);
                }
            }, 40);
        };

        // 🎣 FISHING LOGIC
        document.getElementById('game-container').onclick = (e) => {
            if(e.target.id === "game-container" && stack < 10) {
                stack++;
                document.getElementById('stack').innerText = stack;
                const f = document.createElement('div');
                f.className = 'fish-box';
                document.getElementById('fish-stack').appendChild(f);
            }
        };

        function sell() {
            if(stack > 0) {
                gold += (stack * 25);
                stack = 0;
                document.getElementById('gold').innerText = gold;
                document.getElementById('stack').innerText = stack;
                document.getElementById('fish-stack').innerHTML = '';
            }
        }
    </script>
</body>
</html>
